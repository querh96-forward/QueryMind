- id: schema_categories
  kind: schema
  title: categories数据结构
  content: 商品品类表，主键category_id，包含category_name和description。
  keywords:
  - categories
  - 商品品类表
- id: schema_customers
  kind: schema
  title: customers数据结构
  content: 客户表，主键customer_id，包含company_name、contact_name、city、country等。
  keywords:
  - customers
  - 客户表
- id: schema_employees
  kind: schema
  title: employees数据结构
  content: 销售员工表，主键employee_id，包含first_name、last_name、title、hire_date等。
  keywords:
  - employees
  - 销售员工表
- id: schema_orders
  kind: schema
  title: orders数据结构
  content: 订单表，主键order_id，包含customer_id、employee_id、order_date、required_date、shipped_date、ship_via、freight和收货地区。
  keywords:
  - orders
  - 订单表
- id: schema_order_details
  kind: schema
  title: order_details数据结构
  content: 订单明细表，联合主键order_id与product_id，包含unit_price、quantity和discount。
  keywords:
  - order_details
  - 订单明细表
- id: schema_products
  kind: schema
  title: products数据结构
  content: 商品表，主键product_id，关联supplier_id和category_id，包含unit_price、units_in_stock、units_on_order、reorder_level和discontinued。
  keywords:
  - products
  - 商品表
- id: schema_suppliers
  kind: schema
  title: suppliers数据结构
  content: 供应商表，主键supplier_id，包含company_name、city、country等。
  keywords:
  - suppliers
  - 供应商表
- id: schema_shippers
  kind: schema
  title: shippers数据结构
  content: 物流商表，主键shipper_id，包含company_name和phone。
  keywords:
  - shippers
  - 物流商表
- id: view_v_order_line_sales
  kind: schema
  title: v_order_line_sales分析视图
  content: 订单销售明细视图，已关联订单、客户、员工、商品和品类，并提供gross_sales、discount_amount、sales_amount。
  keywords:
  - v_order_line_sales
  - 视图
  - 汇总
- id: view_v_order_summary
  kind: schema
  title: v_order_summary分析视图
  content: 订单汇总视图，每行一张订单，提供sales_amount、item_quantity、freight_rate、shipping_days和on_time。
  keywords:
  - v_order_summary
  - 视图
  - 汇总
- id: view_v_customer_sales
  kind: schema
  title: v_customer_sales分析视图
  content: 客户销售汇总视图，提供order_count、sales_amount和avg_order_value。
  keywords:
  - v_customer_sales
  - 视图
  - 汇总
- id: view_v_product_sales
  kind: schema
  title: v_product_sales分析视图
  content: 商品销售汇总视图，提供order_count、sales_quantity、sales_amount及库存字段。
  keywords:
  - v_product_sales
  - 视图
  - 汇总
- id: view_v_inventory_status
  kind: schema
  title: v_inventory_status分析视图
  content: 库存状态视图，将商品划分为已停产、需要补货、库存偏低、库存正常。
  keywords:
  - v_inventory_status
  - 视图
  - 汇总
- id: metric_sales
  kind: metric
  title: 销售额
  content: unit_price × quantity × (1 - discount)，优先使用视图字段sales_amount。
  keywords:
  - 销售额
  - 营收
  - 收入
  - sales_amount
- id: metric_gross
  kind: metric
  title: 原价销售额
  content: unit_price × quantity，未扣除折扣。
  keywords:
  - 原价
  - 折扣前
- id: metric_discount
  kind: metric
  title: 折扣金额
  content: unit_price × quantity × discount。
  keywords:
  - 折扣金额
  - 优惠
- id: metric_orders
  kind: metric
  title: 订单量
  content: COUNT(DISTINCT order_id)。
  keywords:
  - 订单量
  - 订单数
- id: metric_aov
  kind: metric
  title: 客单价
  content: 销售额 ÷ 去重订单量。
  keywords:
  - 客单价
  - 平均订单金额
- id: metric_quantity
  kind: metric
  title: 销售数量
  content: SUM(quantity)。
  keywords:
  - 销量
  - 销售数量
  - 件数
- id: metric_shipping
  kind: metric
  title: 平均发货时长
  content: AVG(shipped_date - order_date)，仅统计已发货订单。
  keywords:
  - 发货时长
  - 履约时间
- id: metric_on_time
  kind: metric
  title: 按期发货率
  content: shipped_date <= required_date的已发货订单占比。
  keywords:
  - 按期发货率
  - 准时率
- id: metric_freight
  kind: metric
  title: 运费率
  content: freight ÷ sales_amount；分母为0时不计算。
  keywords:
  - 运费率
  - 物流成本
- id: metric_inventory
  kind: metric
  title: 补货风险
  content: units_in_stock <= reorder_level且商品未停产。
  keywords:
  - 补货
  - 缺货
  - 库存风险
- id: rule_date
  kind: rule
  title: Northwind订单时间范围
  content: 订单数据主要覆盖1996年至1998年；做同比或月度趋势时，应明确完整月份边界。
  keywords:
  - 日期
  - 年份
  - 时间范围
- id: rule_cancel
  kind: rule
  title: 订单状态限制
  content: 经典Northwind没有订单取消状态字段，不应声称排除了取消订单。
  keywords:
  - 取消订单
  - 状态
- id: rule_profit
  kind: rule
  title: 利润不可直接计算
  content: 数据没有商品成本和完整利润字段，不能把销售额当利润。
  keywords:
  - 利润
  - 毛利
  - 成本
- id: rule_customer
  kind: rule
  title: 客户名称
  content: 客户业务名称使用customers.company_name，customer_id只是编码。
  keywords:
  - 客户名称
- id: rule_employee
  kind: rule
  title: 销售员工
  content: employees表示负责订单的销售员工，不是HR薪资数据库。
  keywords:
  - 员工
  - 销售员
- id: rule_inventory
  kind: rule
  title: 库存快照
  content: 库存字段是样例库当前快照，不代表历史每日库存。
  keywords:
  - 库存历史
- id: rule_freight
  kind: rule
  title: 运费归属
  content: freight位于订单层；连接订单明细时必须避免重复累计运费。
  keywords:
  - 运费
  - 重复
- id: rule_discount
  kind: rule
  title: 折扣格式
  content: discount取值0到1，例如0.1代表10%。
  keywords:
  - 折扣率
- id: rule_country
  kind: rule
  title: 地区字段
  content: 订单分析优先使用orders.ship_country；客户注册地使用customers.country，两者语义不同。
  keywords:
  - 国家
  - 地区
- id: rule_currency
  kind: rule
  title: 货币说明
  content: Northwind没有明确币种；界面只显示金额，不应擅自标注人民币或美元。
  keywords:
  - 币种
  - 金额单位
- id: fewshot_monthly
  kind: few_shot
  title: 每月销售额趋势
  content: SELECT to_char(order_date, 'YYYY-MM') AS 月份, ROUND(SUM(sales_amount),2) AS 销售额
    FROM v_order_summary GROUP BY 月份 ORDER BY 月份
  keywords:
  - 月度
  - 趋势
- id: fewshot_top_products
  kind: few_shot
  title: 销售额最高商品
  content: SELECT product_name AS 商品, sales_amount AS 销售额 FROM v_product_sales ORDER
    BY sales_amount DESC LIMIT 10
  keywords:
  - 商品排名
  - top
- id: fewshot_top_customers
  kind: few_shot
  title: 重点客户
  content: SELECT company_name AS 客户, sales_amount AS 销售额, order_count AS 订单量 FROM
    v_customer_sales ORDER BY sales_amount DESC LIMIT 10
  keywords:
  - 客户贡献
- id: fewshot_category
  kind: few_shot
  title: 品类销售
  content: SELECT category_name AS 品类, ROUND(SUM(sales_amount),2) AS 销售额 FROM v_order_line_sales
    GROUP BY category_name ORDER BY 销售额 DESC
  keywords:
  - 品类
- id: fewshot_country
  kind: few_shot
  title: 国家销售
  content: SELECT ship_country AS 国家, ROUND(SUM(sales_amount),2) AS 销售额 FROM v_order_summary
    GROUP BY ship_country ORDER BY 销售额 DESC
  keywords:
  - 国家
  - 地区
- id: fewshot_employee
  kind: few_shot
  title: 员工销售表现
  content: SELECT employee_name AS 销售员工, ROUND(SUM(sales_amount),2) AS 销售额 FROM v_order_summary
    GROUP BY employee_name ORDER BY 销售额 DESC
  keywords:
  - 员工
  - 销售员
- id: fewshot_inventory
  kind: few_shot
  title: 补货风险商品
  content: SELECT product_name AS 商品, units_in_stock AS 库存, reorder_level AS 补货点 FROM
    v_inventory_status WHERE inventory_status IN ('需要补货','库存偏低') ORDER BY 库存
  keywords:
  - 库存
  - 补货
- id: fewshot_shipping
  kind: few_shot
  title: 发货表现
  content: SELECT ROUND(AVG(shipping_days),2) AS 平均发货天数, ROUND(AVG(on_time)*100,2)
    AS 按期发货率 FROM v_order_summary WHERE shipped_date IS NOT NULL
  keywords:
  - 发货
  - 履约
- id: fewshot_freight_country
  kind: few_shot
  title: 各国运费率
  content: SELECT ship_country AS 国家, ROUND(SUM(freight)/SUM(sales_amount)*100,2)
    AS 运费率 FROM v_order_summary GROUP BY ship_country ORDER BY 运费率 DESC
  keywords:
  - 运费率
- id: fewshot_supplier
  kind: few_shot
  title: 供应商商品数
  content: SELECT s.company_name AS 供应商, COUNT(*) AS 商品数 FROM suppliers s JOIN products
    p ON p.supplier_id=s.supplier_id GROUP BY s.supplier_id ORDER BY 商品数 DESC
  keywords:
  - 供应商
- id: fewshot_discount_product
  kind: few_shot
  title: 商品折扣金额
  content: SELECT product_name AS 商品, ROUND(SUM(discount_amount),2) AS 折扣金额 FROM v_order_line_sales
    GROUP BY product_name ORDER BY 折扣金额 DESC LIMIT 10
  keywords:
  - 折扣金额
- id: fewshot_aov_country
  kind: few_shot
  title: 国家客单价
  content: SELECT ship_country AS 国家, ROUND(SUM(sales_amount)/COUNT(*),2) AS 客单价 FROM
    v_order_summary GROUP BY ship_country ORDER BY 客单价 DESC
  keywords:
  - 客单价
  - 国家
- id: fewshot_quarter
  kind: few_shot
  title: 季度销售额
  content: SELECT EXTRACT(YEAR FROM order_date)::int AS 年份, EXTRACT(QUARTER FROM order_date)::int
    AS 季度, ROUND(SUM(sales_amount),2) AS 销售额 FROM v_order_summary GROUP BY 年份,季度 ORDER
    BY 年份,季度
  keywords:
  - 季度
- id: fewshot_repeat
  kind: few_shot
  title: 高频客户
  content: SELECT company_name AS 客户, order_count AS 订单量 FROM v_customer_sales ORDER
    BY order_count DESC LIMIT 10
  keywords:
  - 复购
  - 高频客户
- id: fewshot_stock_value
  kind: few_shot
  title: 库存金额
  content: SELECT product_name AS 商品, ROUND(unit_price*units_in_stock,2) AS 库存金额 FROM
    products WHERE discontinued=0 ORDER BY 库存金额 DESC LIMIT 10
  keywords:
  - 库存金额
